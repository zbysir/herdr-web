<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget=resizes-content 让 Android Chrome 的虚拟键盘直接缩布局视口；
       iOS 不认这个，那边靠 useViewportHeight 顶住（见 src/hooks）。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a1a">
  <!-- 图标是 assets/make-logo.py 生成的（herdr 的羊关在浏览器窗口里，见那个脚本的注释）。
       svg 当 favicon，png 给 iOS 的「添加到主屏幕」—— iOS 不认 svg 的 apple-touch-icon。
       manifest 里 display=standalone：安卓从主屏打开就没有地址栏，等于白送几行终端。 -->
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="herdr">
  <title>herdr-web</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
