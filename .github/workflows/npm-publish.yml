name: 单独重发 npm

# release 已经发好了、只是 npm 那步挂了的时候用这个补发。
# 不重新编译，直接下 release 里的 archive 打包。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发的 tag，比如 v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@11.18.0

      - name: 下 release 产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ inputs.tag }}"; V="${V#v}"
          mkdir -p dist
          gh release download "${{ inputs.tag }}" --dir dist --pattern "herdr-web_${V}_*"

      - run: node scripts/npm-build.mjs "${{ inputs.tag }}"
      - run: node scripts/npm-publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
