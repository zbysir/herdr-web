# 唯一一个会发 npm 的 workflow。
#
# **不能拆成两个**：npm 的 Trusted Publisher（OIDC）一个包只能绑一个 workflow 文件名，
# 绑的就是这个 release.yml。原来那个单独的 npm-publish.yml 一旦发包，OIDC 就对不上。
#
# 两条路：
#   1. 推 tag        —— 完整发布：跑测试 → goreleaser 交叉编译 + 建 GitHub Release → 发 npm
#                       → 出签好名的安卓 APK 挂到同一个 Release 上
#   2. 手动 dispatch —— 补发一样（Release 已经建好了、只是某一步挂了）：
#                       `what=npm` 补 npm：不重新编译，直接下已经发出去的那批 archive 打包，
#                       省掉一次构建，也保证补发的二进制和 Release 里的**逐字节相同**；
#                       `what=apk` 补 APK：按那个 tag 的代码重新编一个挂上去。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "只补发 npm（GitHub Release 必须已经存在），比如 v0.1.0"
        required: true
        type: string
      what:
        description: "补哪一样"
        type: choice
        options: [npm, apk]
        default: npm

permissions:
  contents: write # goreleaser 建 release（补发那条路只用到读）
  id-token: write # npm provenance / Trusted Publisher 的 OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # 两条路的版本号来源不同，在这儿收口成一个变量，后面的步骤就不用各写一遍条件。
      # push 事件里 inputs.tag 是空串，GitHub 表达式里空串是 falsy，所以退到 ref_name。
      TAG: ${{ inputs.tag || github.ref_name }}
      # 补发时只做一样；推 tag 时两样都做
      DO_NPM: ${{ github.event_name == 'push' || inputs.what == 'npm' }}
      DO_APK: ${{ github.event_name == 'push' || inputs.what == 'apk' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 补发时 checkout 指定的 tag；tag push 时这里是空串 = 用触发的那个 ref
          ref: ${{ inputs.tag }}
          fetch-depth: 0 # goreleaser 要全部历史来生成 changelog

      # 补发那条路不编译，所以不装 Go
      - uses: actions/setup-go@v7
        if: github.event_name == 'push'
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 钉住 npm 版本：npm@latest（12.0.0，2026-07-08 发的）的
      # `npm publish --provenance` 是坏的（Cannot find module 'sigstore'）。
      # 11.18.0 是已知能用的最后一版。
      - run: npm install -g npm@11.18.0

      # 补发的是已经发布过的 tag，那次推 tag 时测试就跑过了，这儿不重复跑。
      # typecheck 要 node_modules，而 make test 不负责装（那是 make web 干的），
      # goreleaser 的 before hook 里那次 make web 也是在这之后才跑，指望不上。
      - name: 测试
        if: github.event_name == 'push'
        run: |
          npm --prefix web ci
          make test

      # before hook 会跑 make web 把前端 embed 进去
      - name: goreleaser（交叉编译 + 建 GitHub Release）
        if: github.event_name == 'push'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 下 Release 里的 archive（补发路径）
        if: github.event_name == 'workflow_dispatch' && env.DO_NPM == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern "herdr-web_${TAG#v}_*"

      - name: 打 npm 包
        if: env.DO_NPM == 'true'
        run: node scripts/npm-build.mjs "${TAG#v}"

      # 平台子包先发、根包最后发（脚本里排了序）。反了会有一段时间
      # npm install 装出一个没有二进制的壳。
      - name: 发 npm
        if: env.DO_NPM == 'true'
        run: node scripts/npm-publish.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 安卓 App。放在发 npm **之后**：这一步挂了（钥匙没配、SDK 抽风）不该拦住服务端发版，
      # 回头用 `what=apk` 补一个就行。runner 上自带 Android SDK（ANDROID_HOME），AGP 要 JDK 17–21。
      - uses: actions/setup-java@v5
        if: env.DO_APK == 'true'
        with:
          distribution: temurin
          java-version: 21

      # 签名钥匙两个 secret：jks 的 base64 + 密码（库和私钥同一个，见 app/build.gradle.kts）。
      # **没配就失败，不出 unsigned 包** —— 那种包装不上；也绝不拿 debug 钥匙凑合（以后换正式
      # 钥匙时已经装上的人升级不了，只能卸了重装）。这把钥匙必须和本机出过包的那把是同一把。
      - name: 安卓 APK（签名 + 挂到 Release）
        if: env.DO_APK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_B64: ${{ secrets.HERDR_APP_KEYSTORE_B64 }}
          HERDR_APP_KEY_PASS: ${{ secrets.HERDR_APP_KEY_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$HERDR_APP_KEY_PASS" ]; then
            echo "::error::没配签名钥匙（secrets.HERDR_APP_KEYSTORE_B64 / HERDR_APP_KEY_PASS），不出 APK"
            exit 1
          fi
          export HERDR_APP_KEYSTORE="$RUNNER_TEMP/herdr-web.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$HERDR_APP_KEYSTORE"
          (cd app/android && ./gradlew assembleRelease -PappVersion="$TAG" --no-daemon)
          rm -f "$HERDR_APP_KEYSTORE"
          # 没签上的话 AGP 出的是 app-release-unsigned.apk，这一行就找不到文件、整步失败
          apk="$RUNNER_TEMP/herdr-web_${TAG#v}.apk"
          cp app/android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "$TAG" "$apk" --clobber
